pre-commit:
  jobs:
    # The README and the documents of docs/ are in Japanese. Each other file
    # that holds prose, such as the comments of the code, is in English.
    # .rn/ holds the notes that rn of lovaizu/ccpm keeps on the work, which
    # the checks leave out.
    - name: english
      exclude:
        - "README.md"
        - "docs/*.md"
        - ".rn/**"
    - name: japanese
      glob:
        - "README.md"
        - "docs/*.md"

# The Issues and pull requests of this repository are in English, so the
# Claude Code hook checks their texts with the job english alone.
claude-code:
  jobs:
    - name: claude-code
      args: english
